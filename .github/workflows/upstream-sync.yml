name: Sync upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-tool-results
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev

      - name: Merge upstream changes
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" merge --no-edit --no-ff upstream/dev

      - name: Push updated branch
        run: git push origin HEAD:image-tool-results
